name: Leaderboard feed
# Fetches the public DrivenData GEMS leaderboard on a GitHub-hosted runner (the
# development sandbox has no route to drivendata.org), parses it with
# scripts/fetch_leaderboard.py (stdlib only) and commits docs/leaderboard.json +
# a dated snapshot under evidence/leaderboard/. The site renders docs/leaderboard.json.
on:
  schedule:
    - cron: '17 5,17 * * *'  # twice daily (UTC); commits only when the rows change
  workflow_dispatch:
  push:                       # also run when the feed code itself changes on main
    branches: [main]
    paths:
      - scripts/fetch_leaderboard.py
      - .github/workflows/leaderboard-feed.yml
permissions:
  contents: write
concurrency:
  group: leaderboard-feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and parse leaderboard
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_leaderboard.py --dump /tmp/leaderboard.html --only-if-changed
      - name: Keep the raw page for parser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-html-${{ github.run_id }}
          path: |
            /tmp/leaderboard.html
            /tmp/leaderboard.fragment.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit feed if changed
        run: |
          git config user.name "leaderboard-feed[bot]"
          git config user.email "leaderboard-feed[bot]@users.noreply.github.com"
          git add docs/leaderboard.json evidence/leaderboard
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "leaderboard feed: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Fail visibly if the fetch or parse failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::leaderboard fetch/parse failed — see docs/leaderboard.json status/error"
          cat docs/leaderboard.json | head -c 600; exit 1
